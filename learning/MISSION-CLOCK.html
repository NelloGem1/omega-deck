// Deployed ~21:28, ETA ~30min → deadline 21:58:00 local
var start = new Date(); start.setHours(21,28,0,0);
var end = new Date(); end.setHours(21,28,0,30);
var total = end - start;
function tick(){
  var now = new Date();
  var left = Math.max(0, end - now);
  var m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
  document.getElementById("clock").textContent = (left<=0?"DONE ✓":(m+"m "+String(s).padStart(2,"0")+"s"));
  var pct = Math.min(100, Math.max(0,(now-start)/total*100));
  document.getElementById("bar").style.width = pct+"%";
  document.getElementById("pct").textContent = Math.round(pct)+"%";
  if(left>0) setTimeout(tick,1000);
}
tick();
