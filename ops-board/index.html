<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>LIVE WHITEBOARD</title>
<style>
 body{margin:0;background:#222;color:#eee;font-family:monospace;display:flex;flex-direction:column;height:100vh}
 #bar{display:flex;gap:8px;padding:10px;background:#111;align-items:center}
 #cmd{flex:1;padding:10px;font-size:16px;background:#1a1a1a;color:#eee;border:1px solid #444;border-radius:6px}
 button{padding:10px 18px;font-size:15px;background:#2b2b2b;color:#eee;border:1px solid #555;border-radius:6px;cursor:pointer}
 button:hover{background:#3a3a3a}
 #stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
 canvas{background:#f7f3ea;border-radius:8px;box-shadow:0 8px 40px #000}
 #hint{padding:6px 12px;font-size:12px;color:#888;background:#111}
 #status{padding:4px 12px;font-size:12px;color:#aaa;background:#111}
</style></head><body>
<div id="bar">
 <input id="cmd" placeholder="type: circle · line · house · star · fish · sun · tree · heart…" autofocus>
 <button onclick="send()">DRAW ✎</button>
 <button onclick="post({shape:'clear'})">CLEAR</button>
 <button onclick="grid=!grid;drawBase()">GRID</button>
</div>
<div id="stage"><canvas id="cv" width="960" height="640"></canvas></div>
<div id="hint">circle · ellipse · square · rect · triangle · hexagon · pentagon · star · heart · curve · line · point · house · tree · sun · fish · pattern</div>
<div id="status">ready — type a shape or wait for Devin to draw</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const MARK='#2b2b2b',ACC='#c0392b',PAPER='#f7f3ea';
let grid=false,queue=[],job=null,last=performance.now();
const rad=d=>d*Math.PI/180, lerp=(a,b,t)=>a+(b-a)*t;
function status(s){document.getElementById('status').textContent=s}
function post(o){fetch('/api/draw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...o,key:'__KEY__'})})}

/* ---------- segment drawing (works on any 2d context) ---------- */
function style(c){c.strokeStyle=MARK;c.fillStyle=MARK;c.lineWidth=4;c.lineCap='round';c.lineJoin='round'}
function drawOn(c,s,f){
 style(c);
 if(s.k==='dot'){const r=s.r*f;c.beginPath();c.arc(s.x,s.y,Math.max(1,r),0,7);c.fill();
   if(s.label&&f>=1){c.fillStyle=ACC;c.font='16px monospace';c.fillText(s.label,s.x+12,s.y-10)}}
 else if(s.k==='line'){const x=lerp(s.x1,s.x2,f),y=lerp(s.y1,s.y2,f);
   c.beginPath();c.moveTo(s.x1,s.y1);c.lineTo(x,y);c.stroke();
   c.fillStyle=MARK;c.beginPath();c.arc(x,y,5,0,7);c.fill();
   c.fillStyle=ACC;c.font='16px monospace';c.fillText(`x=${Math.round(lerp(s.x1,s.x2,f))}`,x+10,y-14)}
 else if(s.k==='arc'){c.beginPath();c.arc(s.cx,s.cy,s.r,rad(s.a0),rad(s.a0+(s.a1-s.a0)*f));c.stroke()}
 else if(s.k==='poly'){const pts=s.pts;let total=0;const L=[];
   for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(l);total+=l}
   if(s.close&&pts.length>2){const l=Math.hypot(pts[0][0]-pts[pts.length-1][0],pts[0][1]-pts[pts.length-1][1]);L.push(l);total+=l}
   const target=total*f;let acc=0;
   c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
   const edges=s.close?pts.length:pts.length-1;
   for(let i=0;i<edges&&acc<target;i++){const a=pts[i],b=pts[(i+1)%pts.length];const l=L[i]||0,rem=target-acc;
     if(rem>=l){c.lineTo(b[0],b[1]);acc+=l}else{const t=l?rem/l:0;c.lineTo(lerp(a[0],b[0],t),lerp(a[1],b[1],t));acc=target;break}}
   c.stroke()}
}
function segLen(s){
 if(s.k==='poly'){let L=0;for(let i=1;i<s.pts.length;i++)L+=Math.hypot(s.pts[i][0]-s.pts[i-1][0],s.pts[i][1]-s.pts[i-1][1]);return L}
 if(s.k==='arc')return Math.abs(s.a1-s.a0)*Math.PI/180*s.r;
 if(s.k==='line')return Math.hypot(s.x2-s.x1,s.y2-s.y1);
 return 30;
}

/* ---------- committed layer ---------- */
const committed=document.createElement('canvas');committed.width=960;committed.height=640;
const cctx=committed.getContext('2d');
function drawBase(){ctx.fillStyle=PAPER;ctx.fillRect(0,0,960,640);
 if(grid){ctx.fillStyle='#ddd';for(let x=40;x<960;x+=40)for(let y=40;y<640;y+=40){ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill()}}
 ctx.drawImage(committed,0,0)}
function clearBoard(){cctx.clearRect(0,0,960,640);queue=[];job=null;drawBase();status('cleared')}

/* ---------- shapes ---------- */
const C={x:480,y:320};
const circleSegs=(cx,cy,r)=>[{k:'arc',cx,cy,r,a0:-90,a1:270}];
const ellipseSegs=(cx,cy,rx,ry)=>{const p=[];for(let i=0;i<=72;i++){const a=rad(i/72*360);p.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}return[{k:'poly',pts:p,close:true}]};
const rectSegs=(x,y,w,h)=>[{k:'poly',pts:[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],close:true}];
const triSegs=(a,b,c)=>[{k:'poly',pts:[a,b,c],close:true}];
const ngon=(cx,cy,r,n,rot=-90)=>{const p=[];for(let i=0;i<n;i++){const a=rad(rot+i*360/n);p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return[{k:'poly',pts:p,close:true}]};
const starSegs=(cx,cy,R,r)=>{const p=[];for(let i=0;i<10;i++){const a=rad(-90+i*36),q=i%2?r:R;p.push([cx+q*Math.cos(a),cy+q*Math.sin(a)])}return[{k:'poly',pts:p,close:true}]};
const heartSegs=(cx,cy,s)=>{const p=[];const bez=(p0,p1,p2,p3,n)=>{for(let i=0;i<=n;i++){const t=i/n,u=1-t;
 p.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]])}};
 bez([cx,cy+s*0.3],[cx-s*1.1,cy-s*0.9],[cx-s*0.9,cy-s*1.4],[cx,cy-s*0.4],40);
 bez([cx,cy-s*0.4],[cx+s*0.9,cy-s*1.4],[cx+s*1.1,cy-s*0.9],[cx,cy+s*0.3],40);
 return[{k:'poly',pts:p,close:true}]};
const bezierSeg=(p0,p1,p2,p3,n=60)=>{const p=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;
 p.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]])}return[{k:'poly',pts:p,close:false}]};

const SHAPES={
 point:()=>({label:'point (x,y)',segs:[{k:'dot',x:C.x,y:C.y,r:14}]}),
 line:()=>({label:'line x=0→50',segs:[{k:'line',x1:80,y1:480,x2:880,y2:480}]}),
 circle:a=>({label:`circle r=${a[0]||200}`,segs:circleSegs(C.x,C.y,a[0]||200)}),
 ellipse:()=>({label:'ellipse',segs:ellipseSegs(C.x,C.y,260,140)}),
 square:a=>{const s=a[0]||200,x=C.x-s/2,y=C.y-s/2;return{label:`square s=${s}`,segs:rectSegs(x,y,s,s)}},
 rect:()=>({label:'rectangle',segs:rectSegs(C.x-190,C.y-110,380,220)}),
 rectangle:()=>({label:'rectangle',segs:rectSegs(C.x-190,C.y-110,380,220)}),
 triangle:()=>({label:'triangle',segs:triSegs([C.x,C.y-180],[C.x-190,C.y+140],[C.x+190,C.y+140])}),
 hexagon:()=>({label:'hexagon',segs:ngon(C.x,C.y,200,6)}),
 polygon:()=>({label:'hexagon',segs:ngon(C.x,C.y,200,6)}),
 pentagon:()=>({label:'pentagon',segs:ngon(C.x,C.y,200,5)}),
 star:()=>({label:'star',segs:starSegs(C.x,C.y,200,85)}),
 heart:()=>({label:'heart',segs:heartSegs(C.x,C.y,170)}),
 curve:()=>({label:'bezier curve',segs:bezierSeg([140,460],[480,100],[800,460],[480,400])}),
 house:()=>({label:'house',segs:[
   {k:'poly',pts:[[330,240],[480,110],[630,240]],close:true},
   {k:'poly',pts:[[360,240],[360,430],[600,430],[600,240]],close:true},
   {k:'poly',pts:[[455,430],[455,360],[505,360],[505,430]],close:false},
   {k:'poly',pts:[[390,280],[390,340],[450,340],[450,280]],close:true},
   {k:'poly',pts:[[510,280],[510,340],[570,340],[570,280]],close:true}]}),
 tree:()=>({label:'tree',segs:[
   {k:'poly',pts:[[470,430],[470,300],[490,300],[490,430]],close:true},
   {k:'arc',cx:480,cy:220,r:110,a0:-90,a1:270},
   {k:'poly',pts:[[300,470],[300,485],[660,485],[660,470]],close:false}]}),
 sun:()=>{const segs=circleSegs(C.x,C.y,110);
   for(let i=0;i<8;i++){const a=rad(i*45);segs.push({k:'line',x1:C.x+140*Math.cos(a),y1:C.y+140*Math.sin(a),x2:C.x+185*Math.cos(a),y2:C.y+185*Math.sin(a)})}
   return{label:'sun',segs}},
 fish:()=>({label:'fish',segs:[
   ...ellipseSegs(430,320,160,80),
   {k:'poly',pts:[[580,320],[680,240],[680,400]],close:true},
   {k:'dot',x:370,y:300,r:8},
   {k:'poly',pts:[[430,250],[430,210],[470,240]],close:true}]}),
 pattern:()=>{const segs=[];for(let y=0;y<4;y++)for(let x=0;x<6;x++)segs.push({k:'arc',cx:190+x*116,cy:170+y*110,r:26,a0:-90,a1:270});
   return{label:'pattern 6×4',segs}},
};

/* ---------- job engine ---------- */
function startJob(shape,args){
 const fn=SHAPES[shape];if(!fn)return;
 const j0=fn(args||[]);
 const durs=j0.segs.map(s=>Math.max(350,Math.min(2600,400+segLen(s)*0.9)));
 queue.push({label:j0.label,segs:j0.segs,durs,i:0,t:0});
 status('✎ '+j0.label+' ('+j0.segs.length+' strokes)')
}
function frame(now){
 const dt=Math.min(100,now-last);last=now;
 if(!job&&queue.length){job=queue.shift();job.i=0;job.t=0}
 drawBase();
 if(job){
   job.t+=dt;
   while(job.i<job.segs.length&&job.t>=job.durs[job.i]){drawOn(cctx,job.segs[job.i],1);job.t-=job.durs[job.i];job.i++}
   if(job.i>=job.segs.length){job=null;status('done — ready')}
   else drawOn(ctx,job.segs[job.i],Math.min(1,Math.max(0,job.t/job.durs[job.i])));
 }
 requestAnimationFrame(frame);
}

/* ---------- io ---------- */
function send(){const v=document.getElementById('cmd').value.trim();if(!v)return;
 const p=v.split(/\s+/);const shape=p[0].toLowerCase();
 const args=p.slice(1).map(Number).filter(n=>!isNaN(n));
 post({shape,args});document.getElementById('cmd').value='';
}
document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
const es=new EventSource('/events');
es.onmessage=e=>{try{const c=JSON.parse(e.data);
 if(c.shape==='clear')clearBoard();else startJob(c.shape,c.args||[])}catch(_){}};
es.onerror=()=>status('connection lost — retrying…');
drawBase();requestAnimationFrame(frame);
</script><a href="http://localhost:8088/world" style="position:fixed;left:14px;bottom:14px;z-index:99999;background:rgba(5,7,15,.88);border:1px solid rgba(125,211,252,.4);color:#7dd3fc;padding:8px 14px;border-radius:10px;font:600 12px monospace;text-decoration:none;backdrop-filter:blur(8px);box-shadow:0 0 18px -4px rgba(125,211,252,.4)">🌌 PARALLEL WORLD</a></body></html>
